<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caffeine tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EE;--card:#FBFCFB;--ink:#16201C;--mut:#5C6B65;--line:#D3DAD6;--chip:#E1E7E3;--cur:#3047D9;--fill:rgba(48,71,217,.15);--warn:#C26A0E;--onc:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1412;--card:#161E1B;--ink:#E9EFEB;--mut:#92A39B;--line:#2A3632;--chip:#222D29;--cur:#8396FF;--fill:rgba(131,150,255,.18);--warn:#F0A24E;--onc:#0E1412;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1412;--card:#161E1B;--ink:#E9EFEB;--mut:#92A39B;--line:#2A3632;--chip:#222D29;--cur:#8396FF;--fill:rgba(131,150,255,.18);--warn:#F0A24E;--onc:#0E1412;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cur);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between}
.nav{width:44px;height:44px;border:0;border-radius:50%;background:var(--chip);font-size:22px;line-height:1}
.nav:disabled{opacity:.35;cursor:default}
#dl{border:0;background:none;font-weight:600;font-size:17px;min-height:44px;padding:0 12px}
.big{font-size:92px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:6px 0 0}
.big small{font-size:24px;font-weight:600;letter-spacing:0;color:var(--mut);margin-left:6px}
.sub{margin:4px 0 0;color:var(--mut)}
.sub.k{color:var(--ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px 10px;margin-top:16px}
#rd{min-height:24px;padding:0 4px 4px;color:var(--mut);font-size:15px}
#rd b{color:var(--ink);font-size:17px}
svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mut);font-size:11px;font-family:inherit}
.cv{fill:none;stroke:var(--cur);stroke-width:2.5;stroke-linejoin:round}
.ar{fill:var(--fill);stroke:none}
.one{fill:none;stroke:var(--cur);stroke-width:1;opacity:.35}
.thr{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.thrt{fill:var(--warn);font-size:11px;font-family:inherit;font-weight:600}
.nw{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 3}
.dt{fill:var(--cur)}
.mk{fill:var(--ink)}
.hl{stroke:var(--ink);stroke-width:1;opacity:.5}
.hd{fill:var(--card);stroke:var(--cur);stroke-width:3}
.meter{margin-top:14px;font-size:14px;color:var(--mut)}
.meter div:first-child{display:flex;justify-content:space-between;gap:8px}
.track{height:6px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
#bar{height:100%;background:var(--cur);border-radius:3px;width:0}
#bar.over{background:var(--warn)}
h2{font-size:17px;font-weight:600;margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--chip);font-weight:600}
.chip:active,.sz:active{transform:scale(.97)}
#ago{margin-bottom:4px}#ago .chip{padding:0 12px}
ul{list-style:none;margin:0;padding:0}
#log li{display:grid;grid-template-columns:64px 1fr auto 44px;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:56px}
#log li.empty{display:block;color:var(--mut);padding:14px 0;min-height:0}
.lt{color:var(--mut);font-size:14px}
.ln em{display:block;font-style:normal;color:var(--mut);font-size:13px}
#log button{width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:22px}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.f{display:block;margin:10px 0;font-size:15px;color:var(--mut)}
input{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;width:100%;margin-top:4px}
.fine{font-size:13px;color:var(--mut);margin:12px 0 0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{margin:0}
#x{width:44px;height:44px;border:0;background:var(--chip);border-radius:50%;font-size:22px}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:12px 0}
.sz{min-height:60px;border:0;border-radius:14px;background:var(--cur);color:var(--onc);display:flex;flex-direction:column;align-items:center;justify-content:center}
.sz b{font-size:18px}.sz span{font-size:13px;opacity:.85}
.cu{display:flex;gap:8px;align-items:flex-end}
.cu .f{flex:1;margin:0}
#cadd{min-height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9}
#undo{border:0;background:none;color:inherit;font-weight:800;min-height:44px;padding:0 14px;text-decoration:underline}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="nav" id="pv" aria-label="Previous day">‹</button>
    <button id="dl" aria-label="Jump to today">Today</button>
    <button class="nav" id="nx" aria-label="Next day">›</button>
  </div>
  <p class="big" id="big">0<small>mg</small></p>
  <p class="sub" id="s1"></p>
  <p class="sub k" id="s2"></p>
  <div class="card">
    <div id="rd" aria-live="polite"></div>
    <div id="ch"></div>
  </div>
  <div class="meter"><div id="tot"></div><div class="track"><div id="bar"></div></div></div>

  <h2>Add a drink</h2>
  <div class="chips" id="chips"></div>

  <h2>Logged</h2>
  <ul id="log"></ul>

  <details>
    <summary>Settings</summary>
    <label class="f">Caffeine half-life (hours)<input id="hl" type="number" inputmode="decimal" min="2" max="12" step="0.5"></label>
    <label class="f">Sleep line (mg)<input id="th" type="number" inputmode="numeric" min="10" max="200" step="5"></label>
    <p class="fine">These are estimates. Drink strengths are typical averages and brands vary. Half-life runs about 3 to 7 hours depending on the person. Health authorities generally cite 400 mg a day as a safe limit for most adults.</p>
  </details>
</main>

<div id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <div class="sh"><h2 id="st"></h2><button id="x" aria-label="Close">×</button></div>
    <label class="f">When<input id="tm" type="time"></label>
    <div class="chips" id="ago"><button class="chip" data-m="0">Now</button><button class="chip" data-m="30">30 min ago</button><button class="chip" data-m="60">1 hr ago</button><button class="chip" data-m="120">2 hr ago</button><button class="chip" data-m="180">3 hr ago</button></div>
    <div class="sizes" id="sizes"></div>
    <div class="cu">
      <label class="f"><span id="colab"></span><input id="co" type="number" inputmode="decimal" min="0" step="0.5"></label>
      <button id="cadd">Add</button>
    </div>
  </div>
</div>
<div id="toast" hidden role="status"><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const DRINKS=[
 {id:'coffee',name:'Coffee',mgoz:12,sizes:[6,8,12,16,20]},
 {id:'espresso',name:'Espresso',mgoz:63,sizes:[1,2,3]},
 {id:'cold',name:'Cold brew',mgoz:13,sizes:[12,16,20]},
 {id:'black',name:'Black tea',mgoz:6,sizes:[8,12,16]},
 {id:'green',name:'Green tea',mgoz:3.5,sizes:[8,12,16]},
 {id:'czero',name:'Coke Zero',mgoz:2.83,sizes:[8,12,20]},
 {id:'dcoke',name:'Diet Coke',mgoz:3.83,sizes:[12,20]},
 {id:'coke',name:'Coca‑Cola',mgoz:2.83,sizes:[12,20]},
 {id:'dew',name:'Mountain Dew',mgoz:4.5,sizes:[12,20]},
 {id:'energy',name:'Energy drink',mgoz:10,sizes:[8,12,16,20]},
 {id:'other',name:'Other',mgoz:0,sizes:[]}
];
const KA=4, LS='caffeine-log-v1';
let ago=null;
let S={entries:[],half:5,thr:50}, V=sod(new Date()), hov=null, cur=null, G=null, undoId=null, tt=null;
try{const j=JSON.parse(localStorage.getItem(LS));if(j&&Array.isArray(j.entries))S=Object.assign(S,j)}catch(e){}

function one(e,t){const d=(t-e.t)/36e5;if(d<=0||d>72)return 0;const ke=Math.LN2/S.half;return e.mg*KA/(KA-ke)*(Math.exp(-ke*d)-Math.exp(-KA*d))}
function lvl(t){let s=0;for(const e of S.entries)s+=one(e,t);return s}
const at=i=>new Date(V.getFullYear(),V.getMonth(),V.getDate(),0,i*15).getTime();
function clearAt(){let r=null;const a=Date.now();for(let t=a;t<a+48*36e5;t+=3e5)if(lvl(t)>=S.thr)r=t;return r?r+3e5:null}

function save(){
  S.entries=S.entries.filter(e=>e.t>Date.now()-120*864e5);
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
}

function render(){
  const E=V.getTime(),N=96,end=at(N),now=Date.now(),today=sod(new Date()).getTime()===E;
  const pts=[];for(let i=0;i<=N;i++){const t=at(i);pts.push({t,v:lvl(t)})}
  let pk=pts[0];for(const p of pts)if(p.v>pk.v)pk=p;
  const dayE=S.entries.filter(e=>e.t>=E&&e.t<end).sort((a,b)=>a.t-b.t);
  const total=dayE.reduce((s,e)=>s+e.mg,0);

  $('#dl').textContent=today?'Today':V.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
  $('#nx').disabled=today;
  const nowV=lvl(now);
  $('#big').innerHTML=Math.round(today?nowV:pk.v)+'<small>mg</small>';
  let a='',b='';
  if(today){
    a=nowV<1&&pk.v<1?'Nothing in your system yet.':'in your system right now';
    const r=clearAt();
    if(pk.v>=1)a+=(a?'. ':'')+'Peak '+Math.round(pk.v)+' mg at '+fmt(pk.t);
    if(r)b='Under '+S.thr+' mg by '+fmt(r)+(sod(new Date(r)).getTime()!==E?' tomorrow':'');
    else if(nowV>=1)b='Already under your '+S.thr+' mg sleep line';
  }else{
    a=dayE.length?'at the day’s peak, '+fmt(pk.t):'Nothing logged this day.';
    b=dayE.length?dayE.length+(dayE.length>1?' drinks, ':' drink, ')+total+' mg total':'';
  }
  $('#s1').textContent=a;$('#s2').textContent=b;
  $('#tot').innerHTML='<span>'+total+' mg logged '+(today?'today':'this day')+'</span><span>400 mg limit</span>';
  $('#bar').style.width=Math.min(100,total/4)+'%';$('#bar').classList.toggle('over',total>400);

  const W=360,H=210,ml=36,mr=10,mt=10,mb=26,pw=W-ml-mr,ph=H-mt-mb;
  const ymax=Math.max(100,Math.ceil(Math.max(pk.v,S.thr*2)/50)*50);
  const X=i=>ml+pw*i/N,Y=v=>mt+ph*(1-v/ymax),P=(i,v)=>X(i).toFixed(1)+' '+Y(v).toFixed(1);
  let g='';const step=ymax>250?100:50;
  for(let v=0;v<=ymax;v+=step)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${v}</text>`;
  for(let h=0;h<=24;h+=3){const lab=h%24===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p';g+=`<text x="${X(h*4)}" y="${H-8}" text-anchor="middle" class="ax">${lab}</text>`}
  for(const e of S.entries){let d='',mx=0;for(let i=0;i<=N;i++){const v=one(e,pts[i].t);if(v>mx)mx=v;d+=(i?'L':'M')+P(i,v)}if(mx>=1)g+=`<path d="${d}" class="one"/>`}
  let line='';pts.forEach((p,i)=>line+=(i?'L':'M')+P(i,p.v));
  g+=`<path d="${line}L${P(N,0)}L${P(0,0)}Z" class="ar"/><path d="${line}" class="cv"/>`;
  g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(S.thr)}" y2="${Y(S.thr)}" class="thr"/><text x="${W-mr}" y="${Y(S.thr)-5}" text-anchor="end" class="thrt">sleep line ${S.thr}</text>`;
  for(let i=0;i<=N;i+=4)g+=`<circle cx="${X(i)}" cy="${Y(pts[i].v)}" r="2.5" class="dt"/>`;
  if(today){const ni=(now-E)/(end-E)*N;g+=`<line x1="${X(ni)}" x2="${X(ni)}" y1="${mt}" y2="${Y(0)}" class="nw"/>`}
  for(const e of dayE){const ei=(e.t-E)/(end-E)*N;g+=`<circle cx="${X(ei)}" cy="${Y(0)}" r="4" class="mk"/>`}
  G={pts,ml,pw,W,X,Y,ymax};
  $('#ch').innerHTML=`<svg id="sv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Caffeine in your system by hour">${g}<g id="hv"></g></svg>`;
  drawHover();

  $('#log').innerHTML=dayE.length?dayE.slice().reverse().map(e=>`<li><span class="lt">${fmt(e.t)}</span><span class="ln">${e.name}${e.oz?', '+e.oz+' oz':''}${today?'<em>'+Math.round(one(e,now))+' mg still in your system</em>':''}</span><b>${e.mg} mg</b><button data-del="${e.id}" aria-label="Delete ${e.name} at ${fmt(e.t)}">×</button></li>`).join(''):'<li class="empty">Nothing logged yet. Tap a drink above.</li>';
}

function drawHover(){
  if(!G)return;const hv=$('#hv'),rd=$('#rd');
  if(hov==null){if(hv)hv.innerHTML='';rd.textContent='Touch the chart to read any hour.';return}
  const i=hov*4,p=G.pts[i];
  hv.innerHTML=`<line x1="${G.X(i)}" x2="${G.X(i)}" y1="${G.Y(G.ymax)}" y2="${G.Y(0)}" class="hl"/><circle cx="${G.X(i)}" cy="${G.Y(p.v)}" r="5" class="hd"/>`;
  rd.innerHTML=`<b>${Math.round(p.v)} mg</b> at ${fmt(p.t)}`;
}
function hv(ev){const sv=$('#sv');if(!sv||!G)return;const r=sv.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*G.W;hov=Math.max(0,Math.min(24,Math.round((x-G.ml)/G.pw*24)));drawHover()}
const ch=$('#ch');
ch.addEventListener('pointerdown',hv);
ch.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)hv(e)});
ch.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hov=null;drawHover()}});

function go(n){V=new Date(V.getFullYear(),V.getMonth(),V.getDate()+n);hov=null;render()}
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#dl').onclick=()=>{V=sod(new Date());hov=null;render()};

$('#chips').innerHTML=DRINKS.map(d=>`<button class="chip" data-d="${d.id}">${d.name}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('[data-d]');if(b)openSheet(DRINKS.find(d=>d.id===b.dataset.d))};

function openSheet(d){
  cur=d;ago=null;$('#st').textContent=d.name;
  const n=new Date(),today=sod(n).getTime()===V.getTime();
  $('#tm').value=today?pad(n.getHours())+':'+pad(n.getMinutes()):'08:00';
  $('#sizes').innerHTML=d.sizes.map(o=>`<button class="sz" data-oz="${o}"><b>${o} oz</b><span>${Math.round(o*d.mgoz)} mg</span></button>`).join('');
  $('#colab').textContent=d.mgoz?'Other size (oz)':'Caffeine (mg)';
  $('#co').value='';$('#ago').hidden=!today;$('#scrim').hidden=false;
  const f=$('#sizes button');if(f)f.focus();
}
function closeSheet(){$('#scrim').hidden=true}
function add(oz,mg){
  if(!(mg>0))return;
  const [h,m]=($('#tm').value||'').split(':').map(Number);
  const t=ago!=null?Date.now()-ago*6e4:Number.isFinite(h)?new Date(V.getFullYear(),V.getMonth(),V.getDate(),h,m||0).getTime():Date.now();
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.entries=S.entries.concat([{id,t,name:cur.name,oz:oz||null,mg:Math.round(mg)}]);
  save();closeSheet();render();
  toast('Added '+cur.name+(oz?', '+oz+' oz':', '+Math.round(mg)+' mg'),id);
}
$('#sizes').onclick=e=>{const b=e.target.closest('[data-oz]');if(b){const oz=+b.dataset.oz;add(oz,oz*cur.mgoz)}};
$('#cadd').onclick=()=>{const v=parseFloat($('#co').value);if(!(v>0))return;cur.mgoz?add(v,v*cur.mgoz):add(null,v)};
$('#x').onclick=closeSheet;
$('#tm').oninput=()=>{ago=null};
$('#ago').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;ago=+b.dataset.m;const d=new Date(Date.now()-ago*6e4);$('#tm').value=pad(d.getHours())+':'+pad(d.getMinutes())};
$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function toast(msg,id){undoId=id;$('#tmsg').textContent=msg;$('#toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('#toast').hidden=true,4500)}
$('#undo').onclick=()=>{S.entries=S.entries.filter(e=>e.id!==undoId);save();render();$('#toast').hidden=true};
$('#log').onclick=e=>{const b=e.target.closest('[data-del]');if(b){S.entries=S.entries.filter(x=>x.id!==b.dataset.del);save();render()}};

function syncSettings(){$('#hl').value=S.half;$('#th').value=S.thr}
$('#hl').onchange=e=>{const v=parseFloat(e.target.value);if(v>=2&&v<=12){S.half=v;save();render()}else syncSettings()};
$('#th').onchange=e=>{const v=parseFloat(e.target.value);if(v>=10&&v<=200){S.thr=v;save();render()}else syncSettings()};

syncSettings();render();
setInterval(()=>{if($('#scrim').hidden)render()},60000);
</script>
</body>
</html>
